name: student_flow
description: Accessible, estimate-first cash-flow planning for Canadian students.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  crypto: ^3.0.7
  csv: ^8.0.0
  drift: ^2.35.0
  file_picker: ^12.3.0
  flutter_secure_storage: ^11.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Drift's recommended native encryption engine. The runtime also verifies the
# cipher is present and fails closed before creating or reading financial data.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
